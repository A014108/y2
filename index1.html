<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>欢迎页</title>
<style>
/* ============================================================
   全局重置（合并，只此一份）
   ============================================================ */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: "KaiTi", "STKaiti", "楷体", "Kaiti SC", "Microsoft YaHei", serif;
    background: transparent;
    padding: 0;
    width: 100%;
}

/* ============================================================
   一、欢迎页外框：黑底 + 上下黑边 + 撑高
   ============================================================ */

.welcome-wrap {
    position: relative;
    width: 100%;
    max-width: 1500px;
    margin: 0 auto;
    padding: 64px 0;
    min-height: 680px;
    background: #04070a;
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1;
    container-type: inline-size;
    transition: opacity .9s ease, transform .9s ease, max-height .9s ease .3s, margin .9s ease .3s;
}

.welcome-wrap.hide {
    opacity: 0;
    transform: scale(1.04);
    pointer-events: none;
    max-height: 0;
    margin: 0;
}

/* 16:9 的底图区 */
.welcome-stage {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    border-radius: 8px;
}

/* 上下渐变条：让底图自然没入黑边 */
.welcome-stage::before,
.welcome-stage::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    height: 56px;
    z-index: 2;
    pointer-events: none;
}
.welcome-stage::before {
    top: 0;
    background: linear-gradient(to bottom, #04070a 0%, rgba(4,7,10,.65) 42%, rgba(4,7,10,0) 100%);
}
.welcome-stage::after {
    bottom: 0;
    background: linear-gradient(to top, #04070a 0%, rgba(4,7,10,.65) 42%, rgba(4,7,10,0) 100%);
}

.welcome-bg {
    position: absolute;
    inset: 0;
    background-image: url("https://piv.cc.cd/file/BQACAgUAAyEGAASLVN5eAAJxjmrBLmDl9C8OxXmSkBpmKIIW9q9pAALrJAAC7lYIVrkkSb1ttVxEPQQ.jpg");
    background-size: cover;
    background-position: center;
    z-index: 0;
}

.welcome-mask {
    position: absolute;
    inset: 0;
    z-index: 1;
    background:
        linear-gradient(to right, rgba(3,6,9,.72) 0%, rgba(3,6,9,.15) 30%, rgba(3,6,9,.10) 60%, rgba(3,6,9,.55) 100%),
        radial-gradient(circle at 50% 45%, transparent 30%, rgba(3,6,9,.62) 100%);
}

.welcome-inner {
    position: relative;
    z-index: 5;
    width: 100%;
    height: 100%;
    padding: 18px clamp(16px, 4%, 40px);
    color: #e8e6df;
}

/* 左侧：竖排闪烁标题 */
.welcome-title-v {
    position: absolute;
    left: clamp(52px, 15%, 120px);
    top: 12%;
    writing-mode: vertical-rl;
    text-orientation: upright;
    font-size: clamp(26px, 6.2vw, 46px);
    line-height: 1.05;
    letter-spacing: .16em;
    font-weight: 700;
    color: #5fe6e6;
    text-shadow: 0 0 6px rgba(95,230,230,.85), 0 0 18px rgba(95,230,230,.55), 0 0 34px rgba(95,230,230,.28);
    animation: cyanBlink 2.6s ease-in-out infinite;
    user-select: none;
}

@keyframes cyanBlink {
    0%, 100% {
        opacity: 1;
        text-shadow: 0 0 6px rgba(95,230,230,.9), 0 0 18px rgba(95,230,230,.6), 0 0 34px rgba(95,230,230,.3);
    }
    50% {
        opacity: .62;
        text-shadow: 0 0 3px rgba(95,230,230,.5), 0 0 9px rgba(95,230,230,.3), 0 0 16px rgba(95,230,230,.14);
    }
}

/* 最右侧：角色预览 呼吸圆（大） */
.btn-preview {
    position: absolute;
    right: clamp(12px, 3%, 30px);
    top: 50%;
    transform: translateY(-50%);
    width: clamp(96px, 17vw, 148px);
    height: clamp(96px, 17vw, 148px);
    border-radius: 50%;
    background: rgba(28,8,8,.55);
    border: 1.5px solid rgba(255,95,95,.8);
    color: #ffeaea;
    font-family: inherit;
    font-size: clamp(15px, 2.6vw, 21px);
    line-height: 1.2;
    letter-spacing: .12em;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    cursor: pointer;
    opacity: .5;
    animation: breathRedStrong 2.4s ease-in-out infinite;
    transition: transform .22s ease, filter .22s ease, opacity .22s ease;
    z-index: 3;
}
.btn-preview:hover {
    opacity: 1;
    transform: translateY(-50%) scale(1.05);
    filter: brightness(1.1);
}
.btn-preview .label {
    opacity: 0;
    transition: opacity .25s ease;
}
.btn-preview:hover .label {
    opacity: 1;
}

/* 水平居中 · 从下往上 2/5 处 · 再下移图片宽 1/7：开始游戏（小） */
.btn-start {
    position: absolute;
    left: 50%;
    bottom: 40%;
    /* 兜底位移：容器最大宽 1500 / 7 ≈ 214px */
    transform: translateX(-50%) translateY(214px);
    width: clamp(69px, 12.75vw, 99px);
    height: clamp(69px, 12.75vw, 99px);
    border-radius: 50%;
    background: radial-gradient(circle at 50% 42%, rgba(64,20,20,.55), rgba(18,6,6,.72));

    align-items: center;
    justify-content: center;
    text-align: center;
    cursor: pointer;
    opacity: .5;
    animation: breathRedStrong 2.2s ease-in-out infinite;
    transition: transform .22s ease, filter .22s ease, opacity .22s ease;
    z-index: 3;
}
@supports (width: 1cqw) {
    .btn-start {
        transform: translateX(-50%) translateY(14.2857cqw);
    }
    .btn-start:hover {
        transform: translateX(-50%) translateY(14.2857cqw) scale(1.06);
    }
}
.btn-start:hover {
    opacity: 1;
    filter: brightness(1.12);
}
.btn-start:active {
    filter: brightness(.95);
}
.btn-start .label {
    opacity: 0;
    transition: opacity .25s ease;
}
.btn-start:hover .label {
    opacity: 1;
}

/* 红色呼吸光晕（共用） */
@keyframes breathRedStrong {
    0%, 100% {
        box-shadow: 0 0 10px rgba(255,95,95,.55), 0 0 26px rgba(255,79,79,.30), 0 0 0 0 rgba(255,95,95,.30);
        border-color: rgba(255,95,95,.75);
    }
    50% {

    }
}

/* ============================================================
   二、角色预览弹层
   ============================================================ */

.pp-modal {
    position: absolute;
    inset: 0;
    z-index: 9999;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.62);
    padding: 12px;
    overflow: hidden;
}
.pp-modal.show {
    display: flex;
}

.pp-wrap {
    position: relative;
    width: 100%;
    max-width: 340px;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(20, 20, 22, 0.96);
    flex: 0 0 auto;
}

/* 退出按钮：flex 双向居中，✕ 对准圆心 */
.pp-close {
    position: absolute;
    top: 8px;
    right: 8px;
    z-index: 10;

    height: 30px;

    align-items: center;
    justify-content: center;

    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    user-select: none;
}
.pp-close:hover {
    background: rgba(255, 255, 255, 0.16);
    color: #fff;
}

.pp-stage {
    display: grid;
    grid-template-columns: 1fr;
    position: relative;
}
.pp-content,
.pp-glitch {
    grid-area: 1 / 1;
}

.pp-imgbox {
    width: 100%;
    aspect-ratio: 3 / 4;
    background: rgba(255, 255, 255, 0.05);
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255, 255, 255, 0.3);
    font-size: 13px;
    letter-spacing: 0.1em;
    overflow: hidden;
}
.pp-imgbox img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.pp-name {
    padding: 14px 16px;
    text-align: center;
    font-size: 17px;
    letter-spacing: 0.14em;
    color: #e8e8e8;
    word-break: break-all;
}

.pp-glitch {
    pointer-events: none;
    opacity: 0;
}
.pp-glitch::before {
    content: "";
    display: block;
    width: 100%;
    height: 100%;
    background-image:
        repeating-linear-gradient(
            0deg,
            rgba(255, 255, 255, 0.16) 0px,
            rgba(255, 255, 255, 0.16) 1px,
            transparent 1px,
            transparent 3px
        );
    mix-blend-mode: screen;
}
.pp-glitch::after {
    content: "";
    display: block;
    width: 100%;
    height: 100%;
    margin-top: -100%;
    background-image: linear-gradient(
        90deg,
        rgba(255, 0, 60, 0.28) 0%,
        transparent 18%,
        rgba(0, 200, 255, 0.24) 42%,
        transparent 60%,
        rgba(255, 255, 255, 0.18) 82%,
        transparent 100%
    );
    mix-blend-mode: screen;
}

.fx-switch .pp-content {
    animation: ppBlurOut 0.46s steps(3, end) forwards;
}
.fx-switch .pp-glitch {
    animation: ppGlitch 0.46s steps(1, end) forwards;
}
.fx-boot .pp-content {
    animation: ppBoot 0.5s steps(4, end) forwards;
}

@keyframes ppBlurOut {
    0% { filter: blur(0px) brightness(1); opacity: 1; transform: translateX(0); }
    55% { filter: blur(2.5px) brightness(0.7); opacity: 0.75; transform: translateX(2px); }
    100% { filter: blur(6px) brightness(0.2); opacity: 0.35; transform: translateX(-3px); }
}
@keyframes ppGlitch {
    0% { opacity: 0; transform: translateX(0); }
    18% { opacity: 1; transform: translateX(3px); }
    28% { opacity: 0.35; transform: translateX(-5px); }
    36% { opacity: 1; transform: translateX(4px); }
    46% { opacity: 0.2; transform: translateX(-2px); }
    56% { opacity: 1; transform: translateX(2px); }
    66% { opacity: 0.9; transform: translateX(-4px); }
    76% { opacity: 0.1; transform: translateX(1px); }
    100% { opacity: 0; transform: translateX(0); }
}
@keyframes ppBoot {
    0% { filter: brightness(0); opacity: 0; }
    30% { filter: brightness(0.25); opacity: 1; }
    45% { filter: brightness(1.5); opacity: 1; }
    58% { filter: brightness(0.15); opacity: 1; }
    72% { filter: brightness(1.25); opacity: 1; }
    100% { filter: brightness(1); opacity: 1; }
}

.pp-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 0 16px 16px;
}
.pp-btn {
    flex: 0 0 auto;
    padding: 7px 18px;
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.06);
    color: #ddd;
    font-size: 14px;
    letter-spacing: 0.08em;
    cursor: pointer;
    user-select: none;
}
.pp-btn:hover {
    background: rgba(255, 255, 255, 0.14);
}
.pp-page {
    min-width: 52px;
    text-align: center;
    color: rgba(255, 255, 255, 0.5);
    font-size: 13px;
    letter-spacing: 0.08em;
}
.loading {
    text-align: center;
    padding: 20px;
    color: #999;
}
</style>

<script>

var currentIndex = 0;
var isSwitching = false;
var ppInited = false;

/* ========== 获取消息内容（环境检测用） ==========
   GitHub 独立页上没有这些酒馆函数，先判断有没有，没有就返回 null。 */
function getMessageData() {
    try {
        if (typeof getChatMessages !== 'function' || typeof getCurrentMessageId !== 'function') {
            return null;
        }
        var chatMessages = getChatMessages(getCurrentMessageId());
        if (!chatMessages || chatMessages.length === 0) return null;
        return chatMessages[0].message;
    } catch (e) {
        return null;
    }
}

/* ========== 解析欢迎页可覆盖文案 ========== */
function parseWelcome(messageText) {
    var data = {};
    if (!messageText) return data;
    var tagMatch = messageText.match(/<welcome>([\s\S]*?)<\/welcome>/);
    if (!tagMatch || !tagMatch[1]) return data;
    var lines = tagMatch[1].split("\n");
    lines.forEach(function(line) {
        var idx = line.indexOf(":");
        if (idx > -1) {
            var key = line.slice(0, idx).trim();
            var val = line.slice(idx + 1).trim();
            if (key && val) data[key] = val;
        }
    });
    return data;
}

/* ========== 应用欢迎页文案 ========== */
function applyWelcomeText(data) {
    var titleEl = document.getElementById("welcomeTitle");
    var startEl = document.querySelector("#btnStart .label");

    if (data["标题"] && titleEl) {
        titleEl.textContent = data["标题"];
    }
    if (data["按钮"] && startEl) {
        startEl.textContent = data["按钮"];
    }
}

/* ========== 开始游戏：纯前端收起 ========== */
function bindStart() {
    var wrap = document.getElementById("welcomeWrap");
    var btn = document.getElementById("btnStart");
    if (!wrap || !btn) return;

    btn.addEventListener("click", function () {
        wrap.classList.add("hide");
        setTimeout(function () {
            if (wrap && wrap.parentNode) {
                wrap.style.display = "none";
            }
        }, 1000);
    });
}

/* ========== 预览卡：构建骨架（只建一次） ========== */
function buildPreviewSkeleton() {
    var html = '';
    html += '<span class="pp-close" id="pp-close">✕</span>';
    html += '<div class="pp-stage" id="pp-stage">';
    html += '<div class="pp-content" id="pp-content"></div>';
    html += '<div class="pp-glitch"></div>';
    html += '</div>';
    html += '<div class="pp-nav" id="pp-nav">';
    html += '<span class="pp-btn" data-act="prev">上一页</span>';
    html += '<span class="pp-page" id="pp-page"></span>';
    html += '<span class="pp-btn" data-act="next">下一页</span>';
    html += '</div>';
    document.getElementById("pp-card").innerHTML = html;
}

/* ========== 预览卡：只更新内容区与页码 ========== */
function renderPreviewContent(index) {
    var total = ROLES.length;
    if (index < 0) index = total - 1;
    if (index >= total) index = 0;
    currentIndex = index;

    var role = ROLES[index] || {};
    var name = role.name || "未知角色";
    var img = role.img || "";

    var imgInner = "";
    if (img) {
        imgInner = '<img src="' + img + '" alt="" onerror="this.style.display=\'none\'">';
    } else {
        imgInner = '<div>图片</div>';
    }

    var inner = '';
    inner += '<div class="pp-imgbox">' + imgInner + '</div>';
    inner += '<div class="pp-name">' + name + '</div>';

    document.getElementById("pp-content").innerHTML = inner;
    document.getElementById("pp-page").innerHTML = (index + 1) + ' / ' + total;
}

/* ========== 预览卡：FNAF 式切页 ========== */
function switchTo(newIndex) {
    if (isSwitching) return;
    if (ROLES.length <= 1) return;
    isSwitching = true;

    var stage = document.getElementById("pp-stage");
    stage.classList.add("fx-switch");

    setTimeout(function() {
        renderPreviewContent(newIndex);
    }, 230);

    setTimeout(function() {
        stage.classList.remove("fx-switch");
        stage.classList.add("fx-boot");
    }, 470);

    setTimeout(function() {
        stage.classList.remove("fx-boot");
        isSwitching = false;
    }, 990);
}

/* ========== 预览卡：翻页（事件委托） ========== */
function bindPreviewNav() {
    document.getElementById("pp-nav").addEventListener("click", function(e) {
        var target = e.target;
        if (!target || !target.getAttribute) return;
        var act = target.getAttribute("data-act");
        if (act === "prev") {
            switchTo(currentIndex - 1);
        } else if (act === "next") {
            switchTo(currentIndex + 1);
        }
    });
}

/* ========== 打开 / 关闭预览弹层 ========== */
function bindPreviewToggle() {
    var openBtn = document.getElementById("btnPreview");
    var modal = document.getElementById("pp-modal");

    if (openBtn && modal) {
        openBtn.addEventListener("click", function () {
            if (!ppInited) {
                buildPreviewSkeleton();
                renderPreviewContent(0);
                bindPreviewNav();
                bindPreviewClose();
                ppInited = true;
            }
            modal.classList.add("show");
        });
    }
}

/* ========== 关闭弹层（绑定在骨架生成之后） ========== */
function bindPreviewClose() {
    var closeBtn = document.getElementById("pp-close");
    var modal = document.getElementById("pp-modal");
    if (!closeBtn || !modal) return;

    closeBtn.addEventListener("click", function () {
        modal.classList.remove("show");
    });
}

/* ========== 主函数 ========== */
function init() {
    try {
        var messageText = getMessageData();
        var data = parseWelcome(messageText);
        applyWelcomeText(data);
        bindStart();
        bindPreviewToggle();
    } catch (error) {
        console.error("欢迎页错误:", error);
    }
}

/* ========== 加载（原生写法，不依赖 jQuery） ========== */
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
} else {
    setTimeout(init, 0);
}
</script>
